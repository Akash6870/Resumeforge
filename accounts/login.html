{% extends "base.html" %}
{% block title %}Sign In — ResumeForge{% endblock %}
{% block content %}
<div class="flex min-h-[calc(100vh-4rem)] items-center justify-center px-6">
  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-bold text-white">Welcome back</h1>
      <p class="mt-1 text-sm text-slate-400">Sign in to your ResumeForge account</p>
    </div>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5" for="id_username">Username</label>
        <input type="text" name="username" id="id_username" required autofocus
          class="w-full rounded-xl border border-slate-700 bg-slate-800/60 px-4 py-2.5 text-sm text-slate-100 focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand transition">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5" for="id_password">Password</label>
        <input type="password" name="password" id="id_password" required
          class="w-full rounded-xl border border-slate-700 bg-slate-800/60 px-4 py-2.5 text-sm text-slate-100 focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand transition">
      </div>
      {% if form.errors %}
        <p class="rounded-xl border border-red-700/50 bg-red-900/30 px-4 py-2.5 text-sm text-red-300">Invalid username or password.</p>
      {% endif %}
      <button type="submit" class="w-full rounded-xl bg-brand py-2.5 text-sm font-bold text-white hover:bg-brand-dark transition-all shadow-lg shadow-brand/25">Sign In</button>
    </form>
    <p class="mt-6 text-center text-xs text-slate-500">
      No account? <a href="{% url 'accounts:register' %}" class="font-medium text-brand-light hover:text-brand transition">Create one free →</a>
    </p>
  </div>
</div>
{% endblock %}
